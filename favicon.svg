<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f9d8a" />
      <stop offset="100%" stop-color="#087f70" />
    </linearGradient>
  </defs>

  <!-- Outer Shield / Vault Base -->
  <path 
    d="M 32,6 L 54,14 V 32 C 54,46 32,58 32,58 C 32,58 10,46 10,32 V 14 Z" 
    fill="url(#vaultGrad)" 
    rx="4"
  />

  <!-- Chef Hat Tops (The Vault Crest) -->
  <path 
    d="M 23,28 C 21,23 26,20 29,22 C 30,18 34,18 35,22 C 38,20 43,23 41,28 Z" 
    fill="#ffffff" 
  />

  <!-- Chef Hat Base / Keyhole Base -->
  <path 
    d="M 24,29 H 40 V 33 C 40,34 39,35 38,35 H 26 C 25,35 24,34 24,33 Z" 
    fill="#ffffff" 
  />

  <!-- Vault Keyhole Center -->
  <circle cx="32" cy="41" r="2.5" fill="#ffffff" />
  <polygon points="30.5,41 33.5,41 33,47 31,47" fill="#ffffff" />
</svg>
